<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notas em Tabela</title>
    <style>
        body {
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        table {
            width: 500px;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: center;
        }
        
        th {
            background-color: #525151a4;
        }

        th[colspan="4"] {
            text-align: left;
        } 

        .eh {
            background-color: white;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th rowspan="2">Aréa</th>
                <th rowspan="2">Disciplina</th>
                <th colspan="2">Notas</th>
                <th rowspan="2">Média</th>
            </tr>
            <tr>
                <th>Nota 1ª</th>
                <th>Nota 2ª</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th rowspan="4" class="eh">Exatas</th>
                <td>Matemática</td>
                <td>7.0</td>
                <td>5.6</td>
                <td>3.0</td>
            </tr>
            <tr>
                <td>Física</td>
                <td>8.0</td>
                <td>6.5</td>
                <td>4.0</td>
            </tr>
            <tr>
                <td>Química</td>
                <td>6.0</td>
                <td>7.0</td>
                <td>3.5</td>
            </tr>
            <tr>
                <td>Biologia</td>
                <td>5.0</td>
                <td>6.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <th colspan="4">Média de Exatas</th>
                <th>5.6</th>
            </tr>
            <tr>
                <th rowspan="4" class="eh">Humanas</th>
                <td>História</td>
                <td>10.0</td>
                <td>7.6</td>
                <td>9.5</td>
            </tr>
            <tr>
                <td>Geografia</td>
                <td>9.0</td>
                <td>8.5</td>
                <td>8.8</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th colspan="4">Média de Humanas</th>
                <th>9.2</th>
            </tr>
        </tfoot>
    </table>
</body>
</html>
