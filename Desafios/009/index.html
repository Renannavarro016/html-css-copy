<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="imagens/robo.ico.ico" type="image/x-icon">
    <style>
        body {
            background-color: rgb(20, 20, 20);
            padding: 60px;
        }

        h1 {
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
        }

        .videos {
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            width: auto;
        }

        .videos a:hover {
            transform: translateY(-2px);
            transition: transform 0.6s ease;
        }

        @media screen and (max-width: 990px) {
            .videos {
                display: block;
                margin: auto;
                text-align: center;
            }

            .videos a:hover {
                transform: translateY(-2px);
                transition: transform 0.6s ease;
            }
        }
    </style>
    <style>
        .centralizar {
            text-align: center;
        }
    </style>
    <title>Site com Vídeos</title>
</head>
<body>
    <h1>Vídeos para você assistir</h1>
    <br>
    <div class="videos">
        <a href="pagina do video/index.html" class="corinthians"><img src="imagens/capa corinthians.jpg" alt="capa" width="310" height="360" style="border-radius: 0.5em;"></a>
        <br>
        <br>
        <a href="pagina do video 2/index.html" class="endrick"><img src="imagens/endrick.jpg" alt="capa endrick" width="310" height="360" style="border-radius: 0.5em;"></a>
        <br>
        <br>
        <a href="pagina do video 3/index.html"><img src="imagens/campeão.jpg" alt="" width="310" height="360" style="border-radius: 0.5em;"></a>
    </div>
</body>
</html>
