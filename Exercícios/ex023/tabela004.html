<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de Tabelas</title>
    <style>
        body {
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        table {
            border-collapse: collapse;
            width: 400px;
        }

        caption {
            font-weight: bold;
            text-align: center;
            margin-bottom: 10px;
        }

        td, th {
            border: 1px solid black;
            padding: 10px;
        }

        tr.destaque {
            background-color: rgba(0, 0, 255, 0.329); /* Cor de destaque para a linha */
        }

        col.cprofissao {
            background-color: rgba(0, 0, 255, 0.336);
        }

        col.cnome {
            background-color: rgba(0, 255, 255, 0.329);
        }
    </style>
</head>
<body>
    <h1>Exercício de Tabela</h1>

    <table>
        <colgroup>
        <col class="cnome">
        <col class="csexo">
        <col class="cidade">
        <col class="cprofissao"> <!-- Coluna de profissão com cor de destaque -->
        <!-- Cor de destaque para as colunas -->
        </colgroup>

        <caption>Cadastro</caption>
        <tr>
            <th scope="col">Nome</th>
            <th scope="col">Sexo</th>
            <th scope="col">Idade</th>
            <th scope="col">Profissão</th>
        </tr>
        <tr>
            <td>Joana Nobrega</td>
            <td>F</td>
            <td>26</td>
            <td>Atendente</td>
        </tr>
        <tr>
            <td>João Silva</td>
            <td>M</td>
            <td>30</td>
            <td>Engenheiro</td>
        </tr>
        <tr>
            <td>Maria Oliveira</td>
            <td>F</td>
            <td>22</td>
            <td>Estudante</td>
        </tr>
        <tr>
            <td>Renan</td>
            <td>M</td>
            <td>19</td>
            <td>Programador</td>
        </tr>
        <tr>
            <td>Ana Costa</td>
            <td>F</td>
            <td>35</td>
            <td>Designer</td>
        </tr>
        <tr>
            <td>Pedro Lima</td>
            <td>M</td>
            <td>40</td>
            <td>Gerente</td>
        </tr>
    </table>
</body>
</html>
