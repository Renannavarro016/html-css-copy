<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.conteiner{
            background-color: lightgray;
            display: flex;
            flex-flow: row wrap;
        }

        div.item {
            background-color: cornflowerblue;
            border: 1px solid navy;
            text-align: center;
            flex-basis: 150px;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item">Item 1</div>
        <div class="item">vix cara sla</div>
        <div class="item">Item 3</div>
        <div class="item">vix mano sla mais ainda</div>
        <div class="item">Item 5</div>
    </div>
</body>
</html>
