<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.conteiner{
            background-color: lightgray;
            height: 100px;
            display: flex;
            flex-flow: column wrap;
        }

        div.item {
            background-color: cornflowerblue;
            border: 1px solid navy;
            text-align: center;
            flex: auto;
            
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item">Exemplo de Item 1</div>
        <div class="item">Exemplo de Item 2</div>
        <div class="item">Exemplo de Item 3</div>
        <div class="item">Exemplo de Item 4</div>
        <div class="item">Exemplo de Item 5</div>
        <div class="item">Exemplo de Item 6</div>
    </div>
</body>
</html>
