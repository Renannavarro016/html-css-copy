<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.conteiner{
            background-color: lightgray;
            display: flex;
            flex-flow: row wrap;
            align-items: flex-end;
            height: 400px;
        }

        div.item {
            background-color: cornflowerblue;
            border: 1px solid navy;
            text-align: center;
            padding: 20px;
        }

        #i1 { align-self: center; }

        #i2 { align-self: stretch; }

        #i3 { align-self: flex-end; }

        #i4 { align-self: auto; }

        #i5 { align-self: flex-start; }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item" id="i1">Item 1</div>
        <div class="item" id="i2">Item 2</div>
        <div class="item" id="i3">Item 3</div>
        <div class="item" id="i4">Item 4</div>
        <div class="item" id="i5">Item 5</div>
    </div>
</body>
</html>
