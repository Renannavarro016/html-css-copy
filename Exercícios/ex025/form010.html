<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
    <h1>Exemlps de Formulários</h1>
    <form action="cadastro.php" method="post" autocomplete="on">

        <p>
            <label for="iano">Data de Nasc: </label>
            <input type="number" name="ano" id="iano" min="1900"    max="2025" value="2000" oninput="calcidade()"> 
        </p>

        <p>
            <label for="iidade">Idade: </label>
            <output id="iidade">0</output>
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>

    <script>
        function calcidade() {
            let ano = new Date().getFullYear()
            iidade.value = ano - iano.value
        }
    </script>
</body>
</html>
